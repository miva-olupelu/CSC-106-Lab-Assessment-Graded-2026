<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Student Portfolio</title>
    <!-- Corrected file path relative to project root -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="brand">
            <span class="logo-text">MIVA<strong>Portfolio</strong></span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html">Planner</a></li>
                <!-- Highlighted active class for styling -->
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact-container">
            <h2>Contact Me</h2>
            <p class="section-intro">Have a question or want to collaborate on a project? Fill out the form below, and I will get back to you as soon as possible.</p>
            
            <!-- Universal submission alert element for your JavaScript engine -->
            <div id="formStatus" class="status-message"></div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required placeholder="Enter your full name">
                    <!-- Targeted container for specific error text injection -->
                    <span id="nameError" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" required placeholder="example@email.com">
                    <span id="emailError" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <!-- Removed HTML pattern restriction to allow your JavaScript logic to handle custom evaluation -->
                    <input id="phone" name="phone" type="tel" required placeholder="e.g., 08012345678">
                    <span id="phoneError" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required placeholder="Write your message here..."></textarea>
                    <span id="messageError" class="error-text"></span>
                </div>

                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MIVA Open University. All Rights Reserved.</p>
    </footer>

    <!-- Corrected file path relative to project root -->
    <script src="js/validation.js"></script>
</body>
</html>
